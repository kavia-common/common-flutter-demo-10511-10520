plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.common_flutter_demo"

    // Use explicit values instead of the legacy `flutter.*` ext values that were provided by flutter.gradle.
    // Required by some Flutter plugins (e.g., local_auth_android) which now require compileSdk 35+.
    compileSdk 35

    defaultConfig {
        applicationId "com.example.common_flutter_demo"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            // Uses debug signing by default. For a real release, configure a keystore.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
}

/**
 * Ensure the debug APK exists at the path expected by the preview tooling:
 *   <flutter_project>/build/app/outputs/flutter-apk/app-debug.apk
 *
 * Flutter's Android build produces the APK under:
 *   <flutter_project>/android/app/build/outputs/flutter-apk/app-debug.apk
 *
 * This task copies the generated APK after a debug build completes.
 */
def flutterProjectRoot = file("../..")
def previewExpectedApkDir = new File(flutterProjectRoot, "build/app/outputs/flutter-apk")
def previewExpectedApkFile = new File(previewExpectedApkDir, "app-debug.apk")
def androidFlutterApkFile = file("$buildDir/outputs/flutter-apk/app-debug.apk")

tasks.register("syncDebugApkToFlutterBuildDir", Copy) {
    group = "flutter"
    description = "Copy debug APK to Flutter root build/app/outputs/flutter-apk/app-debug.apk for preview tooling."

    // Only do work if the Android-side APK exists.
    onlyIf {
        androidFlutterApkFile.exists()
    }

    from(androidFlutterApkFile)
    into(previewExpectedApkDir)
    rename { "app-debug.apk" }
}

// Run the sync after standard debug build tasks.
tasks.matching { it.name == "assembleDebug" || it.name == "packageDebug" }.configureEach {
    finalizedBy("syncDebugApkToFlutterBuildDir")
}
